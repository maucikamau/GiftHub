x-healthcheck: &django-health
  test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health/ || exit 1"]
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  web:
    image: ghcr.io/maucikamau/playforward-sandbox:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck: *django-health
    volumes:
      - static-data:/app/staticfiles
      - media-data:/app/backend/media

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .sandbox.env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 1s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  static-data:
  media-data:

networks:
  default:
    external: true
    name: playforward
